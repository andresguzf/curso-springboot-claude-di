spring.application.name=2-spring-di

# --- OpenAPI / Swagger UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# --- Errores ---
spring.mvc.problemdetails.enabled=true

# --- Datos de ejemplo para los componentes Customer e Invoice ---
customer.name=John
customer.lastname=Doe
invoice.description=Compras de supermercado

# --- Sesiones HTTP (Invoice es @SessionScope) ---
# Devtools activa por defecto la persistencia de sesiones: al detener la aplicación
# Tomcat guarda las sesiones en disco en vez de cerrarlas, y el @PreDestroy de los
# beans @SessionScope no se ejecuta. Desactivada, las sesiones se cierran al detener.
server.servlet.session.persistent=false
# Expiración de la sesión por inactividad, para ver el @PreDestroy sin esperar 30 minutos.
# No se usa server.servlet.session.timeout porque Spring Boot lo redondea a minutos
# (mínimo 1 minuto) en Tomcat: AppConfig lo aplica en segundos a cada sesión nueva.
app.session.timeout=30s
# Cada cuánto corre el proceso en segundo plano de Tomcat. Tomcat revisa las sesiones
# vencidas cada 6 ejecuciones: con 5s, cada 30s. El @PreDestroy aparece entre 30 y 60
# segundos después de la última petición.
server.tomcat.background-processor-delay=5s
